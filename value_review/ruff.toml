# Static checks for value_review (05-coverage-audit.md, "Static analysis"). Run from the repository root:
#   python -m ruff check value_review
# Errors that matter (syntax, undefined names, unused imports, likely bugs, security), not style.
extend-exclude = ["frontend", "web", "originals", "annotations", "cache", "sources"]

[lint]
select = [
    "E4", "E7", "E9",   # imports, statements, syntax
    "F",                # pyflakes: undefined names, unused imports and variables
    "B",                # bugbear: likely bugs
    "PLE",              # pylint errors
    "S",                # bandit: security
    "RUF100",           # noqa comments that no longer apply
]

[lint.per-file-ignores]
"tests/**" = ["S101", "S108"]   # asserts and temporary paths are fine in tests
