# One reviewer's Tensile Value Review (ADR-009). From the repository root:
#   docker compose -f value_review/compose.yaml up --build      then open http://127.0.0.1:8766/
# Folders on this computer (set them in value_review/.env, see .env.example, or in the shell):
#   REVIEW_LLM_RESULTS  the LLM results (<paper>-pdf_with_feature_guide.json)   mounted read-only
#   REVIEW_PDFS         the PDFs (<paper>.pdf)                                    mounted read-only
#   REVIEW_DATA         your reviews: originals, drafts, versions, settings, page cache (kept between runs)
#   REVIEW_NAME         your name, the author of your decisions (required)
#   REVIEW_WORKSPACE    optional: a folder with papers/<set>/ and results/<set>/<run>/; Extraction writes results/ only
name: value-review

services:
  review:
    build:
      context: ..
      dockerfile: value_review/Dockerfile
      target: app
    image: value-review:local
    ports:
      - "127.0.0.1:${REVIEW_PORT:-8766}:8766"   # this computer only; never published on the network
    volumes:
      - "${REVIEW_DATA:-./review-data}:/data"
      # The sources must exist. Linux engines stop on a wrong path; Docker Desktop creates an empty folder instead,
      # and the container's log then says which variable to check (value_review/docker_check.py).
      - type: bind
        source: "${REVIEW_LLM_RESULTS:-../llm_baseline/results/gpt-6.1-sol-low-pdf-only}"
        target: /sources/results
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: "${REVIEW_PDFS:-../papers/Tensile_Properties_of_Sub-sized_Specimens_papers}"
        target: /sources/pdfs
        read_only: true
        bind: { create_host_path: false }
      # The workspace (60-workspace-specification.md); an empty volume when REVIEW_WORKSPACE is not set. Writable:
      # Extraction writes its runs under results/ (ADR-028); papers/ is only read.
      - "${REVIEW_WORKSPACE:-no-workspace}:/workspace"
    environment:
      # your name, shown as the author of your decisions and versions (required; change it later in Settings if needed)
      VALUE_REVIEW_REVIEWER: "${REVIEW_NAME:?Set REVIEW_NAME (your name) in value_review/.env}"
      VALUE_REVIEW_PUBLIC_PORT: "${REVIEW_PORT:-8766}"   # the address printed in the log
      VALUE_REVIEW_WORKSPACE: "${REVIEW_WORKSPACE:+/workspace}"   # empty: no workspace
      VALUE_REVIEW_WORKSPACE_SHOWN: "${REVIEW_WORKSPACE:-}"       # the folder as you know it, shown in Settings
    restart: unless-stopped

volumes:
  no-workspace:
